name: Verify and deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify records and DID documents
        run: node tools/verify.js data

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            if [ ! -d /opt/recordweb-org/.git ]; then
              git clone https://github.com/recordweb/recordweb-org.git /opt/recordweb-org
            fi
            cd /opt/recordweb-org
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            docker compose up -d --build
            for i in $(seq 1 15); do
              if docker compose exec -T recordweb-org wget -qO- http://localhost:3000/health; then
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail=50
            exit 1